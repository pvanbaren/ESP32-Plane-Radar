; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; ---------------------------------------------------------------------------
; Adafruit Qualia ESP32-S3 RGB666 (5800) + 4" round 720x720 NV3052C (5793)
; Board in Arduino IDE: "Adafruit Qualia ESP32-S3 RGB666"
;
; Phase 2 bring-up: the -DDISPLAY_TEST_PATTERN flag makes the firmware draw a
; color/ring test pattern instead of the radar app, so the panel can be
; verified on its own. Remove that flag once the display is confirmed.
[env:qualia_s3]
platform = espressif32@6.5.0
board = adafruit_qualia_s3_rgb666
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/qualia_s3.csv
; QIO flash + octal (OPI) PSRAM — the 720x720 framebuffer needs PSRAM
board_build.arduino.memory_type = qio_opi
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (shared with the C3 build)
board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DTARGET_QUALIA_S3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
  ; Comment out the next line to build the full radar app instead of the
  ; standalone display test pattern.
  -DDISPLAY_TEST_PATTERN

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
